; Applied only while building the PHAR (see the `build` target in the Makefile).
;
; The Box version bundled with Laravel Zero 9 ships its own copy of symfony/console that
; uses "${var}" string interpolation. PHP 8.2+ raises a deprecation when compiling it, and
; Box's error handler turns that deprecation into a fatal error before compaction starts.
; Hiding E_DEPRECATED for the build process is enough; it has no effect on the generated code.
error_reporting = E_ALL & ~E_DEPRECATED
